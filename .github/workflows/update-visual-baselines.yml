name: Update visual baselines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Generate the Linux baselines and commit them
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The web image is only published for ARM processors: QEMU lets this x86 machine run it
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Start the Toolshop
        run: docker compose up -d

      - name: Seed the database
        run: |
          for attempt in $(seq 1 30); do
            if docker compose exec -T laravel-api php artisan migrate:fresh --seed --force; then
              exit 0
            fi
            echo "Database not ready yet (attempt $attempt), retrying in 5 seconds"
            sleep 5
          done
          echo "The database could not be seeded"
          exit 1

      - name: Wait for the API
        run: curl --fail --silent --output /dev/null --retry 60 --retry-delay 5 --retry-all-errors http://localhost:8091/products

      # The web app compiles before it starts listening, which can take several minutes
      - name: Wait for the web app
        run: curl --fail --silent --output /dev/null --retry 120 --retry-delay 5 --retry-all-errors http://localhost:4200

      - name: Create the .env file
        run: echo "$ENV_FILE" > .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Take the reference screenshots
        run: npx playwright test --project=visual --update-snapshots

      - name: Commit the new baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual
          git diff --cached --quiet || git commit -m "test(visual): update Linux baselines"
          git push
# Application à tester : Toolshop (images officielles préconstruites)
name: toolshop

services:
  laravel-api:
    image: testsmith/practice-software-testing-${SPRINT:-sprint5}-api
    environment:
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=1
      - DB_PORT=3306
      - DB_HOST=mariadb
      - host=localhost
      - DISABLE_LOGGING=${DISABLE_LOGGING:-false}
    volumes:
      - laravel-app-code:/var/www

  web:
    image: testsmith/practice-software-testing-web
    ports:
      - "8091:80"
    depends_on:
      - laravel-api
    volumes:
      - laravel-app-code:/var/www

  angular-ui:
    image: testsmith/practice-software-testing-${SPRINT:-sprint5}-ui
    ports:
      - "4200:4200"
    command: bash -c "ng serve --host 0.0.0.0 --port 4200"

  mariadb:
    image: yobasystems/alpine-mariadb:10.6.11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: toolshop

  mailcatcher:
    image: dockage/mailcatcher:0.9.0
    ports:
      - "1080:1080"

volumes:
  laravel-app-code: